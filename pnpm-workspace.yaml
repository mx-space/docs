# pnpm 11 的构建脚本许可清单。两者都显式拒绝：
# - sharp 通过 optionalDependencies 的 @img/sharp-win32-x64 预编译二进制工作，已实测 require('sharp') 正常（libvips 8.18.7）
# - esbuild 通过 @esbuild/win32-x64 预编译二进制工作，其 postinstall 只做校验
# 拒绝后 `pnpm install` 不再以 ERR_PNPM_IGNORED_BUILDS 退出 1（CI 需要 exit 0）。
allowBuilds:
  esbuild: false
  sharp: false
minimumReleaseAgeExclude:
  - fumadocs-core@16.15.18
  - fumadocs-ui@16.15.18
  - lucide-react@1.50.0
# 压制 fumadocs 传递依赖（next 子树，本站 Astro 运行时不执行）的已知漏洞：
# 全部强制到各 advisory 的修复版本，详见 pnpm audit --prod。
overrides:
  next: ^16.3.6
  '@babel/core': ^7.29.1
  postcss: ^8.5.22
  esbuild: ^0.28.1
  browserslist: ^4.28.7
  baseline-browser-mapping: ^2.11.0
  sharp: ^0.35.4
# eslint-plugin-astro 依赖的 eslint-plugin-jsx-a11y@6.10.2（已是最新版）
# peer 范围尚未包含 eslint 10，实际规则运行正常，显式放行。
peerDependencyRules:
  allowedVersions:
    eslint: ^10
